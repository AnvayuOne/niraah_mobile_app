name: niraah
description: "Niraah member and provider app. Calls the niraah-platform API at /api/v1 only."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0
  logger: ^2.6.2
  intl: ^0.20.2
  get_it: ^8.2.0
  go_router: ^16.2.5
  flutter_svg: ^2.4.0
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  # Generated by niraah-platform: `pnpm assets:flutter`. Do not edit by hand.
  assets:
    - assets/images/
    - assets/images/options/
    - assets/svg/

  # Design Story typefaces, SIL Open Font License (assets/fonts/OFL-*.txt).
  # Family names must match NType.displayFamily and NType.sansFamily.
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-700.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic-500.ttf
          weight: 500
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
